<h1>Esempi</h1>
<div class="p-4">
  <mat-grid-list cols="3" rowHeight="280px">
    @for (item of esercizi; track item.route) {
      <mat-grid-tile>
        <mat-card appearance="raised" class="p-2">
          <mat-card-header>
            <mat-card-title>{{ item.titolo }}</mat-card-title>
            <mat-card-subtitle>{{ item.sottotitolo }}</mat-card-subtitle>
          </mat-card-header>
          <mat-card-actions class="align-self-center">
            <button mat-button [routerLink]="item.route">Vai</button>
          </mat-card-actions>
        </mat-card>
      </mat-grid-tile>
    }
  </mat-grid-list>
</div>
